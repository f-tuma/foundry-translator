name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MCP dependencies
        run: npm ci --prefix apps/polish-mcp

      - name: Check and build module
        run: npm run check

      - name: Verify tag and manifest metadata
        run: npm run release:verify -- "$GITHUB_REF_NAME"

      - name: Prepare standalone MCP asset
        run: cp apps/polish-mcp/dist/index.cjs apps/polish-mcp/dist/foundry-polish.cjs

      - name: Package Foundry module
        working-directory: dist
        run: zip -r ../foundry-translate.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          foundry-translate.zip
          dist/module.json
          apps/polish-mcp/dist/foundry-polish.cjs
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
