name: Community editor
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/community/package-lock.json
      - run: npm ci
        working-directory: apps/community
      - run: npm run check
        working-directory: apps/community
  weblate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMUNITY_HOST: localhost:3101
      COMMUNITY_SCHEME: http
      COMMUNITY_HTTPS: "0"
      WEBLATE_ADMIN_EMAIL: ci@example.test
      WEBLATE_ADMIN_PASSWORD: ci-ephemeral-test-password
      POSTGRES_PASSWORD: ci-ephemeral-database-password
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Start isolated Weblate and database
        run: docker compose -f compose.community.yml up -d --build --wait --wait-timeout 300 weblate
      - name: Test native permissions, transactions and releases
        run: >-
          docker compose -f compose.community.yml exec -T weblate
          /app/venv/bin/python -c
          'import django; django.setup(); from django.core.management import call_command; call_command("test", "ember_bridge", interactive=False)'
      - name: Service logs on failure
        if: failure()
        run: docker compose -f compose.community.yml logs --tail 100 weblate database
      - name: Clean up ephemeral CI data
        if: always()
        run: docker compose -f compose.community.yml down -v
