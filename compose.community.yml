x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build:
      context: .
      dockerfile: apps/community/Dockerfile.gateway
    restart: unless-stopped
    logging: *logging
    environment:
      COMMUNITY_SCHEME: ${COMMUNITY_SCHEME:-https}
    expose: ["8080"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/vydani && wget -q -O /dev/null http://127.0.0.1:8080/weblate/healthz/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      studio: { condition: service_healthy }
      weblate: { condition: service_healthy }
  studio:
    build:
      context: .
      dockerfile: apps/community/Dockerfile
    restart: unless-stopped
    logging: *logging
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/vydani',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
  weblate:
    build:
      context: .
      dockerfile: apps/community/Dockerfile.weblate
    restart: unless-stopped
    logging: *logging
    environment:
      WEBLATE_SITE_DOMAIN: ${COMMUNITY_HOST:?Set COMMUNITY_HOST}
      WEBLATE_SITE_TITLE: Ember — Český překlad
      WEBLATE_URL_PREFIX: /weblate
      WEBLATE_ADMIN_NAME: ${WEBLATE_ADMIN_NAME:-admin}
      WEBLATE_ADMIN_EMAIL: ${WEBLATE_ADMIN_EMAIL:?Set WEBLATE_ADMIN_EMAIL}
      WEBLATE_ADMIN_PASSWORD: ${WEBLATE_ADMIN_PASSWORD:?Set WEBLATE_ADMIN_PASSWORD}
      WEBLATE_SERVER_EMAIL: ${WEBLATE_ADMIN_EMAIL}
      WEBLATE_DEFAULT_FROM_EMAIL: ${WEBLATE_ADMIN_EMAIL}
      WEBLATE_EMAIL_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      WEBLATE_EMAIL_PORT: ${SMTP_PORT:-587}
      WEBLATE_EMAIL_HOST_USER: ${SMTP_USER:-}
      WEBLATE_EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:-}
      WEBLATE_EMAIL_USE_TLS: ${SMTP_TLS:-1}
      WEBLATE_ENABLE_HTTPS: ${COMMUNITY_HTTPS:-1}
      WEBLATE_IP_PROXY_HEADER: HTTP_X_FORWARDED_FOR
      WEBLATE_SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
      WEBLATE_REQUIRE_LOGIN: "1"
      WEBLATE_REGISTRATION_OPEN: "1"
      WEBLATE_DEFAULT_ACCESS_CONTROL: "100"
      WEBLATE_DEFAULT_TRANSLATION_REVIEW: "1"
      POSTGRES_DATABASE: weblate
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      REDIS_HOST: redis
      WEBLATE_WORKERS: "2"
      CELERY_COMBINED_OPTIONS: --concurrency 2
    volumes:
      - weblate-data:/app/data
    expose: ["8080"]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
  database:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: weblate
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weblate -d weblate"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  maintenance:
    profiles: ["maintenance"]
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    network_mode: none
    volumes:
      - type: volume
        source: weblate-data
        target: /restore/weblate
        volume: { nocopy: true }
      - type: volume
        source: redis-data
        target: /restore/redis
        volume: { nocopy: true }
volumes:
  weblate-data:
  postgres-data:
  redis-data:
