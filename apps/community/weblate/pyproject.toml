[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ember-weblate-bridge"
version = "0.1.0"
description = "Foundry content adapter and TanStack editor endpoints for Weblate"
license = "GPL-3.0-or-later"
[tool.setuptools.packages.find]
include = ["ember_bridge*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
